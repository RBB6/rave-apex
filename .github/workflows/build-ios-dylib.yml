name: Build RaveApexCore (real iOS SDK)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib against real iOS SDK
        run: bash scripts/build_ios_real.sh

      - name: Upload RaveApexCore.dylib
        uses: actions/upload-artifact@v4
        with:
          name: RaveApexCore-dylib
          path: build/RaveApexCore.dylib
          if-no-files-found: error
